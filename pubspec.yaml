name: mdsoft_google_map_user_pick_location_from_scroll
description: "A powerful Flutter package for real-time navigation and route
  tracking using Google Maps API. This package supports background location
  updates, route calculation, and customizable map styles."
version: 0.1.0
homepage: "https://github.com/Salah3mer/google_map_routing_user_pick_location_from_scroll.git"

environment:
  sdk: ^3.4.2
  flutter: ">=3.3.0"

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  google_maps_flutter: ^2.18.2
  toastification: ^3.2.0
  uuid: ^4.6.0
  maps_toolkit: ^3.1.0
  modal_progress_hud_nsn: ^0.5.1
  geolocator: ^14.1.1
  get_it: ^9.3.0
  injectable: ^3.0.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3

flutter:
  plugin:
    platforms:
      web:
        pluginClass: GoogleMapRoutingWeb
        fileName: google_map_routing_web.dart
  assets:
    - assets/images/
